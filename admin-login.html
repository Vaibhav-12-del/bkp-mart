<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BKP Mart Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f5f7fb;
      padding:20px;
    }

    .login-box{
      width:100%;
      max-width:400px;
      background:#fff;
      padding:30px 24px;
      border-radius:20px;
      box-shadow:0 10px 35px rgba(0,0,0,.10);
    }

    .logo{
      text-align:center;
      font-size:30px;
      font-weight:800;
      color:#16a34a;
      margin-bottom:6px;
    }

    .subtitle{
      text-align:center;
      color:#666;
      margin-bottom:25px;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-weight:600;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#16a34a;
    }

    button{
      width:100%;
      margin-top:22px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#16a34a;
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
    }

    #message{
      margin-top:15px;
      text-align:center;
      font-size:14px;
      min-height:20px;
    }

    .error{
      color:#dc2626;
    }

    .success{
      color:#16a34a;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🛒 BKP Mart</div>

    <div class="subtitle">
      Admin Panel Login
    </div>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Admin password"
        required
      >

      <button type="submit" id="loginBtn">
        Login to Admin Panel
      </button>

    </form>

    <div id="message"></div>

  </div>

<script>

const SUPABASE_URL =
"https://vtjxxpuhkylwsddgnkav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MkVBcTXqwhlesjtRg-hJtQ_UVfoMyeE";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  message.textContent = "";
  message.className = "";

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  const { data, error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    message.textContent =
      "❌ Invalid email or password";

    message.className = "error";

    loginBtn.disabled = false;
    loginBtn.textContent =
      "Login to Admin Panel";

    return;
  }

  message.textContent =
    "✅ Login successful...";

  message.className = "success";

  setTimeout(() => {
    window.location.href = "admin.html";
  }, 500);

});

</script>

</body>
</html>
