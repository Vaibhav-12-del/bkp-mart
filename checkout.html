<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BKP Mart - Checkout</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  min-height:100vh;
}

header{
  background:#1b1b1b;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#62e98a;
  font-size:27px;
  font-weight:bold;
}

.nav{
  display:flex;
  gap:15px;
}

.nav a{
  color:#62e98a;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1d1d1d;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
}

h1{
  margin-bottom:20px;
}

h2{
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #555;
  background:#111;
  color:#fff;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#62e98a;
}

.cod{
  border:2px solid #356d49;
  background:#14251b;
  border-radius:18px;
  padding:18px;
}

.cod-title{
  color:#62e98a;
  font-size:23px;
  font-weight:bold;
}

.cod-sub{
  color:#bbb;
  margin-top:5px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  font-size:17px;
}

.total{
  border-top:1px solid #555;
  padding-top:18px;
  font-size:28px;
  font-weight:bold;
  color:#62e98a;
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:17px;
  background:#008b16;
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#62e98a;
  text-decoration:none;
  font-weight:bold;
}

.error{
  display:none;
  background:#301919;
  border:1px solid #a04e4e;
  color:#ff9e9e;
  border-radius:14px;
  padding:15px;
  margin-bottom:18px;
  line-height:1.5;
  word-break:break-word;
}

.success{
  display:none;
  background:#15351f;
  border:1px solid #4c9b64;
  color:#9df0b2;
  border-radius:14px;
  padding:15px;
  margin-bottom:18px;
}

.note{
  color:#aaa;
  text-align:center;
  margin-top:15px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🛒 BKP Mart</div>

  <div class="nav">
    <a href="cart.html">🛒 Cart</a>
    <a href="index.html">🏠 Home</a>
  </div>
</header>


<div class="container">

  <div class="card">

    <h1>Checkout</h1>

    <div id="errorBox" class="error"></div>

    <div id="successBox" class="success"></div>


    <label>Full Name</label>
    <input
      id="name"
      type="text"
      placeholder="Enter your full name"
    >


    <label>Mobile Number</label>
    <input
      id="mobile"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter 10 digit mobile number"
    >


    <label>Address</label>
    <textarea
      id="address"
      placeholder="House no., street, area"
    ></textarea>


    <label>City</label>
    <input
      id="city"
      type="text"
      placeholder="Enter city"
    >


    <label>Pincode</label>
    <input
      id="pincode"
      type="tel"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter 6 digit pincode"
    >

  </div>


  <div class="card">

    <div class="cod">

      <div class="cod-title">
        💵 Cash on Delivery
      </div>

      <div class="cod-sub">
        Pay when your order is delivered
      </div>

    </div>

  </div>


  <div class="card">

    <h2>🛍️ Order Summary</h2>

    <div class="row">
      <span>Items</span>
      <b id="itemCount">0</b>
    </div>

    <div class="row">
      <span>Subtotal</span>
      <b>₹<span id="subtotal">0.00</span></b>
    </div>

    <div class="row">
      <span>Delivery</span>
      <b>₹<span id="delivery">40.00</span></b>
    </div>

    <div class="row total">
      <span>Total</span>
      <span>₹<span id="total">40.00</span></span>
    </div>

  </div>


  <div class="card">

    <button id="placeOrder">
      🛍️ Place Order • COD
    </button>

    <a class="back" href="cart.html">
      ← Back to Cart
    </a>

    <div class="note">
      🔒 Your order details are securely processed.
    </div>

  </div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://vtjxxpuhkylwsddgnkav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MkVBcTXqwhlesjtRg-hJtQ_UVfoMyeE";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   VARIABLES
============================== */

let cart = [];

let deliveryCharge = 40;

let freeDeliveryEnabled = false;

let freeDeliveryAbove = 0;


/* ==============================
   ELEMENTS
============================== */

const nameInput =
document.getElementById("name");

const mobileInput =
document.getElementById("mobile");

const addressInput =
document.getElementById("address");

const cityInput =
document.getElementById("city");

const pincodeInput =
document.getElementById("pincode");

const itemCount =
document.getElementById("itemCount");

const subtotalElement =
document.getElementById("subtotal");

const deliveryElement =
document.getElementById("delivery");

const totalElement =
document.getElementById("total");

const placeOrderButton =
document.getElementById("placeOrder");

const errorBox =
document.getElementById("errorBox");

const successBox =
document.getElementById("successBox");


/* ==============================
   CART
============================== */

function loadCart(){

  try{

    const savedCart =
    localStorage.getItem("bkp_cart");

    if(savedCart){

      const parsed =
      JSON.parse(savedCart);

      if(Array.isArray(parsed)){
        cart = parsed;
      }

    }

  }catch(error){

    console.error(
      "Cart error:",
      error
    );

    cart = [];

  }

}


/* ==============================
   PRICE
============================== */

function getPrice(item){

  return Number(
    item.price ??
    item.sale_price ??
    item.selling_price ??
    0
  );

}


function getQuantity(item){

  return Number(
    item.quantity ??
    item.qty ??
    1
  );

}


function getSubtotal(){

  let amount = 0;

  cart.forEach(item => {

    amount +=
      getPrice(item) *
      getQuantity(item);

  });

  return amount;

}


/* ==============================
   SETTINGS
============================== */

async function loadSettings(){

  try{

    const result =
    await supabaseClient
      .from("settings")
      .select(
        "delivery_charge,free_delivery_enabled,free_delivery_above"
      )
      .limit(1)
      .maybeSingle();


    if(!result.error && result.data){

      deliveryCharge =
        Number(
          result.data.delivery_charge ?? 40
        );

      freeDeliveryEnabled =
        Boolean(
          result.data.free_delivery_enabled
        );

      freeDeliveryAbove =
        Number(
          result.data.free_delivery_above ?? 0
        );

    }

  }catch(error){

    console.log(
      "Settings not loaded:",
      error
    );

  }

  updateSummary();

}


/* ==============================
   SUMMARY
============================== */

function updateSummary(){

  const subtotal =
    getSubtotal();

  let delivery =
    deliveryCharge;


  if(
    freeDeliveryEnabled &&
    subtotal >= freeDeliveryAbove
  ){

    delivery = 0;

  }


  const total =
    subtotal + delivery;


  let items = 0;

  cart.forEach(item => {

    items +=
      getQuantity(item);

  });


  itemCount.textContent =
    items;

  subtotalElement.textContent =
    subtotal.toFixed(2);

  deliveryElement.textContent =
    delivery.toFixed(2);

  totalElement.textContent =
    total.toFixed(2);

}


/* ==============================
   ERROR
============================== */

function showError(message){

  successBox.style.display =
    "none";

  errorBox.style.display =
    "block";

  errorBox.innerHTML =
    "⚠️ " + message;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==============================
   SUCCESS
============================== */

function showSuccess(message){

  errorBox.style.display =
    "none";

  successBox.style.display =
    "block";

  successBox.textContent =
    "✅ " + message;

}


/* ==============================
   PLACE ORDER
============================== */

async function placeOrder(){

  errorBox.style.display =
    "none";


  /* CART CHECK */

  if(!cart.length){

    showError(
      "Your cart is empty."
    );

    return;

  }


  /* FORM VALUES */

  const name =
    nameInput.value.trim();

  const mobile =
    mobileInput.value.trim();

  const address =
    addressInput.value.trim();

  const city =
    cityInput.value.trim();

  const pincode =
    pincodeInput.value.trim();


  /* VALIDATION */

  if(!name){

    showError(
      "Please enter your name."
    );

    return;

  }


  if(!/^[0-9]{10}$/.test(mobile)){

    showError(
      "Please enter a valid 10 digit mobile number."
    );

    return;

  }


  if(!address){

    showError(
      "Please enter your address."
    );

    return;

  }


  if(!city){

    showError(
      "Please enter your city."
    );

    return;

  }


  if(!/^[0-9]{6}$/.test(pincode)){

    showError(
      "Please enter a valid 6 digit pincode."
    );

    return;

  }


  /* TOTAL */

  const subtotal =
    getSubtotal();

  let delivery =
    deliveryCharge;


  if(
    freeDeliveryEnabled &&
    subtotal >= freeDeliveryAbove
  ){

    delivery = 0;

  }


  const total =
    subtotal + delivery;


  /* ORDER DATA */

  const orderData = {

    customer_name:
      name,

    customer_mobile:
      mobile,

    customer_address:
      address,

    customer_city:
      city,

    customer_pincode:
      pincode,

    items:
      cart,

    total_amount:
      total,

    status:
      "pending"

  };


  console.log(
    "ORDER DATA:",
    orderData
  );


  /* BUTTON */

  placeOrderButton.disabled =
    true;

  placeOrderButton.textContent =
    "⏳ Placing Order...";


  try{

    /* SUPABASE INSERT */

    const result =
    await supabaseClient
      .from("orders")
      .insert(orderData);


    console.log(
      "SUPABASE RESULT:",
      result
    );


    if(result.error){

      throw new Error(
        result.error.message
      );

    }


    /* CLEAR CART */

    localStorage.removeItem(
      "bkp_cart"
    );


    /* SUCCESS */

    showSuccess(
      "Order placed successfully! Redirecting..."
    );


    setTimeout(function(){

      window.location.href =
        "order-success.html";

    },1000);


  }catch(error){

    console.error(
      "ORDER ERROR:",
      error
    );


    /*
      IMPORTANT:
      Actual Supabase error
      will now be shown.
    */

    showError(
      error.message ||
      "Order could not be placed."
    );


    placeOrderButton.disabled =
      false;

    placeOrderButton.textContent =
      "🛍️ Place Order • COD";

  }

}


/* ==============================
   START
============================== */

loadCart();

updateSummary();

loadSettings();


/* ==============================
   BUTTON
============================== */

placeOrderButton.addEventListener(
  "click",
  placeOrder
);

</script>

</body>
</html>
