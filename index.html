<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BKP Mart</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6f7;
  color:#222;
  padding-bottom:30px;
}

/* HEADER */

header{
  background:#0c8f3d;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-top{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:23px;
  font-weight:bold;
  white-space:nowrap;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.track-btn,
.cart-btn{
  color:white;
  text-decoration:none;
  background:rgba(255,255,255,.16);
  padding:9px 10px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

.cart-btn{
  position:relative;
}

.cart-count{
  position:absolute;
  top:-7px;
  right:-7px;
  background:#ff3b30;
  color:white;
  min-width:20px;
  height:20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

/* SEARCH */

.search-box{
  max-width:700px;
  margin:13px auto 0;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  padding:14px 15px;
  border-radius:11px;
  font-size:15px;
}

/* CATEGORIES */

.categories{
  max-width:700px;
  margin:15px auto;
  padding:0 12px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  background:white;
  border:1px solid #ddd;
  padding:9px 14px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-size:13px;
}

.category.active{
  background:#0c8f3d;
  color:white;
  border-color:#0c8f3d;
}

/* MAIN */

.container{
  max-width:700px;
  margin:auto;
  padding:0 12px;
}

.section-title{
  font-size:20px;
  font-weight:bold;
  margin:18px 0 12px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
  position:relative;
}

.product-click{
  display:block;
  color:inherit;
  text-decoration:none;
  cursor:pointer;
}

.product-image{
  width:100%;
  height:170px;
  object-fit:contain;
  display:block;
  background:white;
  padding:8px;
}

.product-info{
  padding:11px;
}

.product-name{
  font-size:14px;
  font-weight:bold;
  min-height:36px;
  line-height:18px;
}

.price-row{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.price{
  font-size:17px;
  font-weight:bold;
}

.mrp{
  font-size:12px;
  color:#888;
  text-decoration:line-through;
}

.discount{
  position:absolute;
  top:8px;
  left:8px;
  background:#e7f8ed;
  color:#0c8f3d;
  font-size:11px;
  font-weight:bold;
  padding:5px 7px;
  border-radius:6px;
  z-index:2;
}

.stock{
  font-size:11px;
  color:#e67e00;
  margin-top:5px;
}

.add-btn{
  width:100%;
  margin-top:9px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#0c8f3d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.add-btn:active{
  transform:scale(.97);
}

.loading,
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 20px;
  color:#777;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:9px;
  font-size:14px;
  z-index:999;
  transition:.3s;
  white-space:nowrap;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:380px){

  .logo{
    font-size:19px;
  }

  .track-btn,
  .cart-btn{
    padding:8px;
    font-size:12px;
  }

  .product-image{
    height:145px;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header-top">

    <div class="logo">
      🛒 BKP Mart
    </div>

    <div class="header-actions">

      <a
        href="order-track.html"
        class="track-btn"
      >
        📦 Track
      </a>

      <a
        href="cart.html"
        class="cart-btn"
      >
        🛒 Cart

        <span
          class="cart-count"
          id="cartCount"
        >
          0
        </span>

      </a>

    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="search"
      id="searchInput"
      placeholder="Search products..."
      autocomplete="off"
    >

  </div>

</header>


<!-- CATEGORIES -->

<div
  class="categories"
  id="categories"
>

  <div
    class="category active"
    data-category="all"
  >
    All
  </div>

</div>


<!-- PRODUCTS -->

<div class="container">

  <div class="section-title">
    Products
  </div>

  <div
    class="products"
    id="products"
  >

    <div class="loading">
      Loading products...
    </div>

  </div>

</div>


<!-- TOAST -->

<div
  class="toast"
  id="toast"
>
  Added to cart 🛒
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://vtjxxpuhkylwsddgnkav.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MkVBcTXqwhlesjtRg-hJtQ_UVfoMyeE";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let allProducts = [];

let selectedCategory = "all";


/* =========================
   CART
========================= */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem("bkp_cart") || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "bkp_cart",
    JSON.stringify(cart)
  );

}


function updateCartCount(){

  const cart = getCart();

  let count = 0;

  cart.forEach(item => {

    count += Number(
      item.quantity ||
      item.qty ||
      1
    );

  });


  document.getElementById("cartCount")
    .textContent = count;

}


/* =========================
   ADD TO CART
========================= */

function addToCart(product){

  event.preventDefault();
  event.stopPropagation();


  let cart = getCart();


  const existing =
    cart.find(item =>
      String(item.id) ===
      String(product.id)
    );


  const stock =
    Number(product.stock || 0);


  if(stock <= 0){

    showToast("Product is out of stock");

    return;

  }


  if(existing){

    const current =
      Number(existing.quantity || 1);


    if(current >= stock){

      showToast(
        "Maximum stock available: " +
        stock
      );

      return;

    }


    existing.quantity =
      current + 1;

  }else{

    cart.push({

      id: product.id,

      name:
        product.Name ||
        product.name ||
        "Product",

      price:
        Number(product.price || 0),

      mrp:
        Number(product.mrp || 0),

      image:
        product.image || "",

      quantity:1

    });

  }


  saveCart(cart);

  updateCartCount();

  showToast("Added to cart 🛒");

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");


  toast.textContent =
    message;


  toast.classList.add("show");


  setTimeout(() => {

    toast.classList.remove("show");

  },1800);

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const box =
    document.getElementById("products");


  box.innerHTML =
    '<div class="loading">Loading products...</div>';


  const {
    data,
    error
  } =
    await db
      .from("products")
      .select("*")
      .order("id",{
        ascending:false
      });


  if(error){

    console.error(
      "Products Error:",
      error
    );


    box.innerHTML = `
      <div class="empty">
        Products load nahi ho pa rahe.<br>
        Please try again.
      </div>
    `;

    return;

  }


  allProducts =
    data || [];


  createCategories(
    allProducts
  );


  displayProducts();

}


/* =========================
   CATEGORIES
========================= */

function createCategories(products){

  const categories =
    [
      ...new Set(
        products
          .map(product =>
            product.category
          )
          .filter(Boolean)
      )
    ];


  const box =
    document.getElementById(
      "categories"
    );


  box.innerHTML = "";


  /* ALL */

  const all =
    document.createElement(
      "div"
    );

  all.className =
    "category active";

  all.dataset.category =
    "all";

  all.textContent =
    "All";


  box.appendChild(all);


  /* OTHER CATEGORIES */

  categories.forEach(category => {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "category";


    div.dataset.category =
      category;


    div.textContent =
      category;


    box.appendChild(div);

  });


  /* CLICK */

  box
    .querySelectorAll(
      ".category"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          box
            .querySelectorAll(
              ".category"
            )
            .forEach(item =>
              item.classList
                .remove("active")
            );


          this.classList.add(
            "active"
          );


          selectedCategory =
            this.dataset.category;


          displayProducts();

        }
      );

    });

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(){

  const box =
    document.getElementById(
      "products"
    );


  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


  const products =
    allProducts.filter(
      product => {

        const name =
          String(
            product.Name ||
            product.name ||
            ""
          )
          .toLowerCase();


        const category =
          String(
            product.category ||
            ""
          )
          .toLowerCase();


        const searchMatch =
          !search ||
          name.includes(search) ||
          category.includes(search);


        const categoryMatch =
          selectedCategory ===
          "all" ||
          String(
            product.category
          ) ===
          selectedCategory;


        return (
          searchMatch &&
          categoryMatch
        );

      }
    );


  if(!products.length){

    box.innerHTML =
      `
      <div class="empty">
        No products found.
      </div>
      `;

    return;

  }


  box.innerHTML = "";


  products.forEach(product => {

    const name =
      product.Name ||
      product.name ||
      "Product";


    const price =
      Number(
        product.price || 0
      );


    const mrp =
      Number(
        product.mrp || 0
      );


    const stock =
      Number(
        product.stock || 0
      );


    const image =
      product.image ||
      "https://via.placeholder.com/300x300?text=BKP+Mart";


    let discount = 0;


    if(
      mrp > price &&
      mrp > 0
    ){

      discount =
        Math.round(
          ((mrp-price)/mrp)*100
        );

    }


    /* PRODUCT CARD */

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "product";


    /* DISCOUNT */

    let discountHTML = "";


    if(discount > 0){

      discountHTML =
        `
        <div class="discount">
          ${discount}% OFF
        </div>
        `;

    }


    /* STOCK */

    let stockHTML = "";


    if(
      stock > 0 &&
      stock <= 5
    ){

      stockHTML =
        `
        <div class="stock">
          Only ${stock} left
        </div>
        `;

    }


    if(stock <= 0){

      stockHTML =
        `
        <div
          class="stock"
          style="color:#d00000;"
        >
          Out of Stock
        </div>
        `;

    }


    div.innerHTML = `

      ${discountHTML}


      <a
        href="product.html?id=${encodeURIComponent(product.id)}"
        class="product-click"
      >

        <img
          class="product-image"
          src="${escapeHtml(image)}"
          alt="${escapeHtml(name)}"
          onerror="this.src='https://via.placeholder.com/300x300?text=BKP+Mart'"
        >


        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(name)}
          </div>


          <div class="price-row">

            <span class="price">
              ₹${price.toFixed(0)}
            </span>


            ${
              mrp > price
              ?
              `
              <span class="mrp">
                ₹${mrp.toFixed(0)}
              </span>
              `
              :
              ""
            }

          </div>


          ${stockHTML}

        </div>

      </a>


      <div
        style="padding:0 11px 11px;"
      >

        <button
          class="add-btn"
          ${
            stock <= 0
            ?
            "disabled"
            :
            ""
          }
          onclick='addToCart(${JSON.stringify(product).replace(/'/g,"&#39;")})'
          style="${
            stock <= 0
            ?
            "opacity:.5;cursor:not-allowed;"
            :
            ""
          }"
        >

          ${
            stock <= 0
            ?
            "Out of Stock"
            :
            "Add to Cart"
          }

        </button>

      </div>

    `;


    box.appendChild(div);

  });

}


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function(){

      displayProducts();

    }
  );


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START
========================= */

updateCartCount();

loadProducts();

</script>

</body>
</html>
