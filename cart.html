<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BKP Mart - Cart</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6f7;
  color:#222;
  padding-bottom:30px;
}

/* HEADER */

header{
  background:#0c8f3d;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  font-size:30px;
  line-height:1;
  cursor:pointer;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

/* MAIN */

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.title{
  font-size:22px;
  font-weight:bold;
  margin:8px 0 15px;
}

/* CART ITEM */

.cart-item{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.item-image{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:10px;
  background:#fff;
  flex-shrink:0;
}

.item-info{
  flex:1;
  min-width:0;
}

.item-name{
  font-size:15px;
  font-weight:bold;
  line-height:20px;
}

.item-price{
  margin-top:6px;
  font-size:17px;
  font-weight:bold;
}

.item-mrp{
  margin-left:5px;
  color:#888;
  font-size:12px;
  text-decoration:line-through;
  font-weight:normal;
}

/* QUANTITY */

.item-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:10px;
}

.quantity{
  display:flex;
  align-items:center;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
}

.quantity button{
  width:32px;
  height:32px;
  border:0;
  background:#f2f2f2;
  font-size:20px;
  cursor:pointer;
}

.quantity span{
  width:35px;
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.remove{
  border:0;
  background:none;
  color:#d00000;
  font-size:12px;
  cursor:pointer;
}

/* SUMMARY */

.summary{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-top:16px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.summary-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:13px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:9px 0;
  font-size:14px;
}

.delivery{
  color:#0c8f3d;
  font-weight:bold;
}

.total-row{
  border-top:1px solid #eee;
  padding-top:13px;
  margin-top:13px;
  display:flex;
  justify-content:space-between;
  font-size:19px;
  font-weight:bold;
}

.checkout-btn{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#0c8f3d;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.checkout-btn:active{
  transform:scale(.98);
}

/* EMPTY */

.empty{
  background:white;
  border-radius:15px;
  padding:45px 20px;
  text-align:center;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.empty-icon{
  font-size:55px;
  margin-bottom:12px;
}

.empty-title{
  font-size:20px;
  font-weight:bold;
}

.empty-text{
  color:#777;
  font-size:14px;
  margin-top:7px;
}

.shop-btn{
  display:inline-block;
  margin-top:18px;
  padding:12px 20px;
  border-radius:9px;
  background:#0c8f3d;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:9px;
  font-size:14px;
  transition:.3s;
  z-index:999;
  white-space:nowrap;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:380px){

  .item-image{
    width:75px;
    height:75px;
  }

  .item-name{
    font-size:14px;
  }

  .item-price{
    font-size:16px;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header-inner">

    <div
      class="back"
      onclick="goBack()"
    >
      ‹
    </div>

    <div class="logo">
      🛒 BKP Mart
    </div>

  </div>

</header>


<div class="container">

  <div class="title">
    My Cart
  </div>


  <!-- CART -->

  <div id="cartContainer"></div>


  <!-- SUMMARY -->

  <div
    id="summary"
    class="summary"
    style="display:none;"
  >

    <div class="summary-title">
      Order Summary
    </div>


    <div class="summary-row">

      <span>
        Items
      </span>

      <span id="itemCount">
        0
      </span>

    </div>


    <div class="summary-row">

      <span>
        Subtotal
      </span>

      <span id="subtotal">
        ₹0
      </span>

    </div>


    <div class="summary-row">

      <span>
        Delivery
      </span>

      <span
        id="delivery"
        class="delivery"
      >
        Free
      </span>

    </div>


    <div class="total-row">

      <span>
        Total
      </span>

      <span id="total">
        ₹0
      </span>

    </div>


    <button
      class="checkout-btn"
      onclick="goCheckout()"
    >
      Proceed to Checkout
    </button>

  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
>
  Cart updated
</div>


<script>

/* =========================
   CART
========================= */

function getCart(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem(
          "bkp_cart"
        ) || "[]"
      );

    return Array.isArray(cart)
      ? cart
      : [];

  }catch(error){

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "bkp_cart",
    JSON.stringify(cart)
  );

}


/* =========================
   LOAD CART
========================= */

function renderCart(){

  const cart =
    getCart();


  const container =
    document.getElementById(
      "cartContainer"
    );


  const summary =
    document.getElementById(
      "summary"
    );


  if(!cart.length){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <div class="empty-title">
          Your cart is empty
        </div>

        <div class="empty-text">
          Add some products to continue shopping.
        </div>

        <a
          href="index.html"
          class="shop-btn"
        >
          Start Shopping
        </a>

      </div>

    `;


    summary.style.display =
      "none";

    return;

  }


  summary.style.display =
    "block";


  container.innerHTML =
    "";


  cart.forEach(
    (item,index) => {

      const quantity =
        Number(
          item.quantity ||
          item.qty ||
          1
        );


      const price =
        Number(
          item.price || 0
        );


      const mrp =
        Number(
          item.mrp || 0
        );


      const image =
        item.image ||
        "https://via.placeholder.com/200x200?text=BKP+Mart";


      const name =
        item.name ||
        item.Name ||
        "Product";


      const itemTotal =
        price * quantity;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "cart-item";


      div.innerHTML = `

        <img
          class="item-image"
          src="${escapeHtml(image)}"
          alt="${escapeHtml(name)}"
          onerror="this.src='https://via.placeholder.com/200x200?text=BKP+Mart'"
        >


        <div class="item-info">

          <div class="item-name">
            ${escapeHtml(name)}
          </div>


          <div class="item-price">

            ₹${price.toFixed(0)}

            ${
              mrp > price
              ?
              `
              <span class="item-mrp">
                ₹${mrp.toFixed(0)}
              </span>
              `
              :
              ""
            }

          </div>


          <div class="item-bottom">

            <div class="quantity">

              <button
                onclick="changeQuantity(${index},-1)"
              >
                −
              </button>

              <span>
                ${quantity}
              </span>

              <button
                onclick="changeQuantity(${index},1)"
              >
                +
              </button>

            </div>


            <div
              style="font-weight:bold;font-size:14px;"
            >
              ₹${itemTotal.toFixed(0)}
            </div>


            <button
              class="remove"
              onclick="removeItem(${index})"
            >
              Remove
            </button>

          </div>

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );


  updateSummary(cart);

}


/* =========================
   SUMMARY
========================= */

function updateSummary(cart){

  let subtotal = 0;

  let itemCount = 0;


  cart.forEach(item => {

    const quantity =
      Number(
        item.quantity ||
        item.qty ||
        1
      );


    const price =
      Number(
        item.price || 0
      );


    subtotal +=
      price * quantity;


    itemCount +=
      quantity;

  });


  document.getElementById(
    "itemCount"
  ).textContent =
    itemCount;


  document.getElementById(
    "subtotal"
  ).textContent =
    "₹" + subtotal.toFixed(0);


  /*
    Current BKP Mart setup:
    Delivery charge is handled
    again in checkout.
  */

  document.getElementById(
    "delivery"
  ).textContent =
    "Calculated at checkout";


  document.getElementById(
    "total"
  ).textContent =
    "₹" + subtotal.toFixed(0);

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(
  index,
  change
){

  let cart =
    getCart();


  if(!cart[index]){
    return;
  }


  let quantity =
    Number(
      cart[index].quantity ||
      cart[index].qty ||
      1
    );


  quantity += change;


  if(quantity <= 0){

    cart.splice(
      index,
      1
    );

    saveCart(cart);

    renderCart();

    showToast(
      "Product removed"
    );

    return;

  }


  cart[index].quantity =
    quantity;


  saveCart(cart);

  renderCart();

  showToast(
    "Cart updated"
  );

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

  let cart =
    getCart();


  if(!cart[index]){
    return;
  }


  cart.splice(
    index,
    1
  );


  saveCart(cart);

  renderCart();

  showToast(
    "Product removed"
  );

}


/* =========================
   CHECKOUT
========================= */

function goCheckout(){

  const cart =
    getCart();


  if(!cart.length){

    showToast(
      "Cart is empty"
    );

    return;

  }


  window.location.href =
    "checkout.html";

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(() => {

    toast.classList.remove(
      "show"
    );

  },1600);

}


/* =========================
   BACK
========================= */

function goBack(){

  if(document.referrer){

    history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START
========================= */

renderCart();

</script>

</body>
</html>
